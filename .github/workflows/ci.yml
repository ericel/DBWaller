name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    uses: ./.github/workflows/container.yml
    with:
      export_image: true

  verify-daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Conan and detect profile
        run: |
          python -m pip install conan
          conan profile detect --force
      - name: Install optional daemon dependencies
        run: >
          conan install . --output-folder=build --build=missing -r conancenter
          -s build_type=Release -s compiler.cppstd=20
          -o '&:with_daemon=True' -o '&:with_tests=True' -o '&:with_remote_tests=True'
          -o '&:with_benchmarks=False' -o '&:build_apps=False'
          -c tools.build:jobs=2
      # Building dbwaller_wire validates the schema with Conan's matching
      # protoc/runtime. The embedded job needs no system Protobuf installation.
      - name: Validate protocol and build daemon
        run: |
          cmake --preset conan-release-tests
          cmake --build --preset build-conan-release-tests -j 2
      - name: Run Tier B including daemon and public client tests
        run: ctest --preset tier-b-main --no-tests=error
      - name: Verify daemon package
        run: >
          conan create . --build=missing -r conancenter
          -s build_type=Release -s compiler.cppstd=20
          -o '&:with_daemon=True' -o '&:with_tests=False'
          -o '&:build_apps=False' -o '&:with_benchmarks=False'
          -c tools.build:jobs=2

      - name: Verify standalone C++ client package
        run: >
          conan create sdk/cpp --build=missing -r conancenter
          -s build_type=Release -s compiler.cppstd=20 -c tools.build:jobs=2

      - name: Build unrelated client example from installed package
        run: |
          conan install examples/remote_cpp --output-folder=build/remote-example --build=missing -r conancenter \
            -s build_type=Release -s compiler.cppstd=20 -c tools.build:jobs=2
          cmake -S examples/remote_cpp -B build/remote-example/build/Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build/remote-example/build/Release/generators/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/remote-example/build/Release -j 2
          python tests/system/remote/installed_example.py \
            --daemon build/build/Release/apps/dbwaller_daemon/dbwallerd \
            --example build/remote-example/build/Release/dbwaller_remote_example

  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Install dependencies
        run: >
          conan install . --output-folder=build --build=missing
          -s build_type=Release
          -s compiler.cppstd=20
          -o '&:with_tests=True'
          -o '&:with_benchmarks=False'
          -o '&:build_apps=False'

      - name: Configure
        run: cmake --preset conan-release-tests

      - name: Build
        run: cmake --build --preset build-conan-release-tests

      - name: Run Tier A tests
        run: ctest --preset tier-a-pr

      - name: Verify Conan package
        run: >
          conan create . --build=missing
          -s build_type=Release
          -s compiler.cppstd=20
          -o '&:with_tests=False'
          -o '&:with_benchmarks=False'
          -o '&:build_apps=False'
