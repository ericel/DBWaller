name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  container:
    uses: ./.github/workflows/container.yml
    with:
      export_image: true

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Read tracked version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches VERSION
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.value }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${{ steps.version.outputs.value }}"
            exit 1
          fi

      - name: Install dependencies
        run: >
          conan install . --output-folder=build --build=missing
          -s build_type=Release
          -s compiler.cppstd=20
          -o '&:with_tests=True'
          -o '&:with_benchmarks=False'
          -o '&:build_apps=False'

      - name: Configure
        run: cmake --preset conan-release-tests

      - name: Build
        run: cmake --build --preset build-conan-release-tests

      - name: Run Tier B tests
        run: ctest --preset tier-b-main

      - name: Create Conan package
        run: >
          conan create . --build=missing
          -s build_type=Release
          -s compiler.cppstd=20
          -o '&:with_tests=False'
          -o '&:with_benchmarks=False'
          -o '&:build_apps=False'

  publish:
    runs-on: ubuntu-latest
    needs: [validate, container]
    permissions:
      contents: write
      packages: write
    environment:
      name: release

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Read tracked version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: daemon-container-release
          path: dist

      - name: Verify and load the tested daemon image
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          docker load --input "dist/dbwaller-daemon-${VERSION}-linux-amd64.tar.gz"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested daemon image
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/dbwaller-daemon:${VERSION}-linux-amd64"
          if existing=$(docker manifest inspect "$image" 2>manifest-error.txt); then
            existing_id=$(printf '%s' "$existing" | jq -r '.config.digest // empty')
            tested_id=$(docker image inspect "dbwaller-daemon:${VERSION}-linux-amd64" --format '{{.Id}}')
            if [ "$existing_id" != "$tested_id" ]; then
              echo "Refusing to overwrite a different existing release image: $image"
              exit 1
            fi
          elif ! grep -Eq 'manifest unknown|name unknown|no such manifest' manifest-error.txt; then
            cat manifest-error.txt >&2
            echo "Registry state could not be verified; publication stopped."
            exit 1
          fi
          docker tag "dbwaller-daemon:${VERSION}-linux-amd64" "$image"
          docker push "$image"
          docker image inspect "$image" --format '{{join .RepoDigests "\n"}}' > dist/IMAGE_DIGESTS.txt

      - name: Create Conan package for publishing
        run: >
          conan create . --build=missing
          -s build_type=Release
          -s compiler.cppstd=20
          -o '&:with_tests=False'
          -o '&:with_benchmarks=False'
          -o '&:build_apps=False'

      - name: Upload Conan package to Artifactory (optional)
        if: ${{ vars.ARTIFACTORY_REMOTE_NAME != '' && vars.ARTIFACTORY_REMOTE_URL != '' }}
        env:
          ARTIFACTORY_REMOTE_NAME: ${{ vars.ARTIFACTORY_REMOTE_NAME }}
          ARTIFACTORY_REMOTE_URL: ${{ vars.ARTIFACTORY_REMOTE_URL }}
          ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        run: |
          # GitHub does not allow the secrets context in step conditions.
          if [ -z "${ARTIFACTORY_USERNAME}" ] || [ -z "${ARTIFACTORY_PASSWORD}" ]; then
            echo "Skipping optional Artifactory upload: credentials are not configured."
            exit 0
          fi
          conan remote add "${ARTIFACTORY_REMOTE_NAME}" "${ARTIFACTORY_REMOTE_URL}" --force
          conan remote login "${ARTIFACTORY_REMOTE_NAME}" "${ARTIFACTORY_USERNAME}" -p "${ARTIFACTORY_PASSWORD}"
          conan upload "dbwaller/${{ steps.version.outputs.value }}" --remote="${ARTIFACTORY_REMOTE_NAME}" --confirm

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
